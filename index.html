<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | Productivity Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header glass-card">
      <div class="header-branding">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <div>
          <h1 class="app-title">TaskFlow</h1>
          <p class="greeting-text" id="greetingText">Good morning! ☀️</p>
        </div>
      </div>

      <!-- Live Clock & Theme Switcher -->
      <div class="header-actions">
        <div class="clock-badge">
          <div class="clock-time" id="clockTime">12:00:00 PM</div>
          <div class="clock-date" id="clockDate">Wednesday, Aug 26</div>
        </div>

        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle Light/Dark Mode">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Statistics Overview Bar -->
    <section class="stats-grid">
      <div class="stat-card glass-card">
        <div class="stat-icon icon-total">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div class="stat-details">
          <span class="stat-label">Total Tasks</span>
          <span class="stat-value" id="statTotal">0</span>
        </div>
      </div>

      <div class="stat-card glass-card">
        <div class="stat-icon icon-active">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <div class="stat-details">
          <span class="stat-label">In Progress</span>
          <span class="stat-value" id="statActive">0</span>
        </div>
      </div>

      <div class="stat-card glass-card">
        <div class="stat-icon icon-completed">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <div class="stat-details">
          <span class="stat-label">Completed</span>
          <span class="stat-value" id="statCompleted">0</span>
        </div>
      </div>

      <div class="stat-card glass-card stat-progress-card">
        <div class="stat-details-full">
          <div class="progress-header">
            <span class="stat-label">Completion Rate</span>
            <span class="progress-percentage" id="statProgressPct">0%</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Main Content Layout -->
    <main class="main-layout">
      <!-- Left Column: Add Task Form & Quick Filters -->
      <aside class="sidebar-column">
        <div class="glass-card form-card">
          <h2 class="section-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add New Task
          </h2>
          <form id="taskForm" autocomplete="off">
            <div class="form-group">
              <label for="taskTitle">Task Title <span class="required">*</span></label>
              <input type="text" id="taskTitle" placeholder="What needs to be done?" required autofocus>
            </div>

            <div class="form-group">
              <label for="taskDesc">Description / Notes</label>
              <textarea id="taskDesc" rows="2" placeholder="Add optional details or notes..."></textarea>
            </div>

            <div class="form-row">
              <div class="form-group flex-1">
                <label>Priority</label>
                <div class="priority-selector">
                  <label class="priority-option option-high">
                    <input type="radio" name="priority" value="High">
                    <span class="priority-pill">High</span>
                  </label>
                  <label class="priority-option option-medium">
                    <input type="radio" name="priority" value="Medium" checked>
                    <span class="priority-pill">Med</span>
                  </label>
                  <label class="priority-option option-low">
                    <input type="radio" name="priority" value="Low">
                    <span class="priority-pill">Low</span>
                  </label>
                </div>
              </div>

              <div class="form-group flex-1">
                <label for="taskCategory">Category</label>
                <select id="taskCategory">
                  <option value="Work">💼 Work</option>
                  <option value="Personal">🏠 Personal</option>
                  <option value="Study">📚 Study</option>
                  <option value="Health">🧘 Health</option>
                  <option value="Finance">💳 Finance</option>
                  <option value="Game (Online)">🎮 Game (Online)</option>
                  <option value="Game (Physical)">⚽ Game (Physical)</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="taskDueDate">Due Date</label>
              <input type="date" id="taskDueDate">
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Add Task</span>
            </button>
          </form>
        </div>

        <!-- Motivation Widget -->
        <div class="glass-card quote-card">
          <div class="quote-icon">⚡</div>
          <p class="quote-text" id="quoteText">"Focus on being productive instead of busy."</p>
          <span class="quote-author" id="quoteAuthor">— Tim Ferriss</span>
        </div>
      </aside>

      <!-- Right Column: Task List & Controls -->
      <section class="tasks-column">
        <!-- Control Bar (Search, Filters, Sort, Actions) -->
        <div class="glass-card controls-card">
          <!-- Search input -->
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Search tasks by title or tag...">
            <button class="clear-search-btn hidden" id="clearSearchBtn" aria-label="Clear search">&times;</button>
          </div>

          <!-- Status Filter Tabs -->
          <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">
              All <span class="tab-badge" id="tabBadgeAll">0</span>
            </button>
            <button class="tab-btn" data-filter="active">
              Active <span class="tab-badge" id="tabBadgeActive">0</span>
            </button>
            <button class="tab-btn" data-filter="completed">
              Completed <span class="tab-badge" id="tabBadgeCompleted">0</span>
            </button>
          </div>

          <!-- Dropdowns & Secondary Actions -->
          <div class="secondary-controls">
            <div class="select-wrapper">
              <select id="categoryFilterSelect" aria-label="Filter by Category">
                <option value="all">All Categories</option>
                <option value="Work">💼 Work</option>
                <option value="Personal">🏠 Personal</option>
                <option value="Study">📚 Study</option>
                <option value="Health">🧘 Health</option>
                <option value="Finance">💳 Finance</option>
                <option value="Game (Online)">🎮 Game (Online)</option>
                <option value="Game (Physical)">⚽ Game (Physical)</option>
              </select>
            </div>

            <div class="select-wrapper">
              <select id="priorityFilterSelect" aria-label="Filter by Priority">
                <option value="all">All Priorities</option>
                <option value="High">🔴 High Priority</option>
                <option value="Medium">🟡 Medium Priority</option>
                <option value="Low">🟢 Low Priority</option>
              </select>
            </div>

            <div class="select-wrapper">
              <select id="sortBySelect" aria-label="Sort Tasks">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="priority">Priority (High to Low)</option>
                <option value="dueDate">Due Date</option>
              </select>
            </div>

            <button class="btn btn-outline btn-sm" id="clearCompletedBtn" title="Clear all completed tasks">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              <span>Clear Done</span>
            </button>
          </div>
        </div>

        <!-- Task List Container -->
        <div class="task-list-wrapper">
          <ul class="task-list" id="taskList">
            <!-- Dynamic task items inserted here by JS -->
          </ul>

          <!-- Empty State Container -->
          <div class="empty-state hidden" id="emptyState">
            <div class="empty-icon">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
            </div>
            <h3 class="empty-title" id="emptyTitle">No tasks found</h3>
            <p class="empty-desc" id="emptyDesc">Looks like you're all caught up, or your filters matched no tasks!</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal-overlay hidden" id="editModalOverlay">
    <div class="modal-card glass-card">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <button class="close-modal-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="editTaskForm">
        <input type="hidden" id="editTaskId">
        <div class="form-group">
          <label for="editTaskTitle">Title</label>
          <input type="text" id="editTaskTitle" required>
        </div>
        <div class="form-group">
          <label for="editTaskDesc">Description</label>
          <textarea id="editTaskDesc" rows="2"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label>Priority</label>
            <select id="editTaskPriority">
              <option value="High">🔴 High</option>
              <option value="Medium">🟡 Medium</option>
              <option value="Low">🟢 Low</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label for="editTaskCategory">Category</label>
            <select id="editTaskCategory">
              <option value="Work">💼 Work</option>
              <option value="Personal">🏠 Personal</option>
              <option value="Study">📚 Study</option>
              <option value="Health">🧘 Health</option>
              <option value="Finance">💳 Finance</option>
              <option value="Game (Online)">🎮 Game (Online)</option>
              <option value="Game (Physical)">⚽ Game (Physical)</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="editTaskDueDate">Due Date</label>
          <input type="date" id="editTaskDueDate">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancelEditBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
